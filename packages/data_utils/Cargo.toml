[package]
name = "cistercian"
version = "0.1.0"
edition = "2024"

[lib]
name = "cistercian"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", features = ["png"] }
log = "0.4.34"
ndarray = "0.17.2"
numpy = {version = "0.29.0", optional = true}
pyo3 = {version = "0.29.2", optional = true}
pyo3-log = { version = "0.13.4", optional = true }
rand = "0.10.2"

[features]
default = ["python_binding"]
python_binding = ["dep:pyo3", "dep:numpy", "dep:pyo3-log"]
