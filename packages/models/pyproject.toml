[project]
name = "models"
version = "0.1.0"
description = "Model definitions and training for the classifiers"
readme = "README.md"
authors = [
    { name = "dstilesr" }
]
requires-python = ">=3.14"
dependencies = [
    "data-utils",
    "pydantic>=2,<3",
    "torch>=2,<3",
]

[project.scripts]
models = "models:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
data-utils = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
